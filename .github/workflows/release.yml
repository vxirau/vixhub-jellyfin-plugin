name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Package plugin
        run: ./scripts/package.sh
      - name: Update repository manifest from release bytes
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/update-manifest.py \
            --archive "artifacts/vixhub-plugin_${version}.zip" \
            --version "$version"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/vixhub-plugin_*.zip
            artifacts/apply-web-customizations.sh
      - name: Publish updated plugin manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update plugin manifest for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
