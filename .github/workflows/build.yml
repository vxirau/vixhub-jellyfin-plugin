name: Build

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Package plugin
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vixhub-jellyfin-plugin
          path: |
            artifacts/vixhub-plugin_*.zip
            artifacts/apply-web-customizations.sh
          if-no-files-found: error
